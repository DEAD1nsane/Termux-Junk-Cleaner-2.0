name: Explain failing CI

on:
  workflow_run:
    workflows: ["Cleaner checks"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  explain-pr-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR with CI failure explanation
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-failure-explainer -->';
            const { workflow_run } = context.payload;
            const prs = workflow_run.pull_requests || [];

            if (!prs.length) {
              core.info('No PRs are linked to this failed workflow run.');
              return;
            }

            const body = [
              marker,
              'This job failed because `tjc.sh` is intentionally blocked from running outside a Termux/Android environment.',
              '',
              'The workflow runs on `ubuntu-latest`, so it reaches `ensure_termux()` in `tjc.sh` and exits with:',
              '',
              '> This tool is Termux-only. On other systems paths differ. Re-run with --force to override.',
              '',
              'This is expected on GitHub-hosted Linux runners. To make CI pass here, the script would need to be run under a Termux environment or explicitly bypass the safety check for non-Termux runners.'
            ].join('\n');

            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const alreadyCommented = comments.some(comment => comment.body && comment.body.includes(marker));
              if (alreadyCommented) {
                core.info(`Skipping duplicate comment on PR #${pr.number}`);
                continue;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
