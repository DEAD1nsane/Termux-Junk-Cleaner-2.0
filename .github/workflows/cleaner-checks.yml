name: Cleaner checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Termux environment
        shell: bash
        run: |
          if [ -n "${TERMUX_VERSION:-}" ] || [ -d /data/data/com.termux/files/usr ]; then
            echo "TERMUX=true" >> "$GITHUB_ENV"
          else
            echo "TERMUX=false" >> "$GITHUB_ENV"
          fi

      - name: Check Bash syntax
        run: bash -n tjc.sh

      - name: Check help output
        if: env.TERMUX == 'true'
        run: bash tjc.sh --help

      - name: Run isolated dry-run
        if: env.TERMUX == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/home" "$test_root/prefix/var/cache" "$test_root/tmp"
          HOME="$test_root/home" PREFIX="$test_root/prefix" TMPDIR="$test_root/tmp" bash tjc.sh --dry-run

      - name: Skip dry-run outside Termux
        if: env.TERMUX != 'true'
        run: echo "Skipping Termux-only dry-run on non-Termux runner."
