name: Cleaner checks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n tjc.sh

      - name: Check help output
        run: bash tjc.sh --help

      - name: Run isolated dry-run
        shell: bash
        run: |
          set -euo pipefail
          test_root=$(mktemp -d)
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/home" "$test_root/prefix/var/cache" "$test_root/tmp"
          HOME="$test_root/home" PREFIX="$test_root/prefix" TMPDIR="$test_root/tmp" bash tjc.sh --dry-run

      - name: Explain why the PR check failed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const body = [
              'This job failed because `tjc.sh` is intentionally blocked from running outside a Termux/Android environment.',
              '',
              'The workflow runs on `ubuntu-latest`, so it reaches `ensure_termux()` in `tjc.sh` and exits with:',
              '',
              '> This tool is Termux-only. On other systems paths differ. Re-run with --force to override.',
              '',
              'This is expected on GitHub-hosted Linux runners. To make CI pass here, the script would need to run under a Termux environment or explicitly bypass the safety check for non-Termux runners.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
